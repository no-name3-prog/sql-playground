name: Maintainer

# Runs after CI finishes on a PR branch, or on demand.
# Experienced-maintainer bot: reviews quality/security and merges when safe.
on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to review/merge'
        required: true
        type: string

concurrency:
  group: maintainer-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  checks: read
  actions: read

jobs:
  review-and-merge:
    name: Senior maintainer (review · merge)
    runs-on: ubuntu-latest
    # Only act on successful CI for pull_request runs (not main push CI)
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'pull_request')

    steps:
      - name: Resolve PR number
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            if (context.eventName === 'workflow_dispatch') {
              const n = '${{ inputs.pr_number }}';
              if (!n) throw new Error('pr_number is required');
              core.setOutput('number', n);
              const { data: pr } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: Number(n),
              });
              core.setOutput('head_sha', pr.head.sha);
              core.setOutput('base_sha', pr.base.sha);
              core.setOutput('head_ref', pr.head.ref);
              core.setOutput('mergeable', String(pr.mergeable_state || ''));
              core.setOutput('draft', String(pr.draft));
              core.setOutput('title', pr.title);
              return;
            }
            const run = context.payload.workflow_run;
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              head: `${context.repo.owner}:${run.head_branch}`,
            });
            // Prefer PR associated with this workflow_run
            let pr = prs[0];
            if (run.pull_requests && run.pull_requests.length) {
              const id = run.pull_requests[0].number;
              const found = prs.find(p => p.number === id);
              if (found) pr = found;
              if (!pr) {
                const { data } = await github.rest.pulls.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: id,
                });
                pr = data;
              }
            }
            if (!pr) {
              core.setOutput('number', '');
              core.notice('No open PR for this CI run — nothing to maintain.');
              return;
            }
            core.setOutput('number', String(pr.number));
            core.setOutput('head_sha', pr.head.sha);
            core.setOutput('base_sha', pr.base.sha);
            core.setOutput('head_ref', pr.head.ref);
            core.setOutput('draft', String(pr.draft));
            core.setOutput('title', pr.title);

      - name: Skip if no PR
        if: steps.pr.outputs.number == ''
        run: echo "No PR to process."

      - name: Checkout PR head
        if: steps.pr.outputs.number != ''
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.head_sha }}
          fetch-depth: 0

      - name: Fetch base for diff
        if: steps.pr.outputs.number != ''
        run: |
          git fetch origin main:main || git fetch origin ${{ github.event.repository.default_branch }}:main
          git fetch origin ${{ steps.pr.outputs.head_sha }}
          # Always use the maintainer script from main (PR branch may predate the bot)
          git show main:.github/scripts/maintainer-review.mjs > /tmp/maintainer-review.mjs
          chmod +x /tmp/maintainer-review.mjs

      - name: Run maintainer review
        id: review
        if: steps.pr.outputs.number != ''
        continue-on-error: true
        env:
          BASE_SHA: main
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        run: node /tmp/maintainer-review.mjs

      - name: Capture review outcome
        if: steps.pr.outputs.number != ''
        id: outcome
        run: |
          if [ -f /tmp/maintainer-verdict.json ]; then
            APPROVED=$(node -e "const v=require('/tmp/maintainer-verdict.json'); console.log(v.approved === true)")
            echo "approved=$APPROVED" >> "$GITHUB_OUTPUT"
            if [ "$APPROVED" = "true" ]; then
              echo "review_ok=true" >> "$GITHUB_OUTPUT"
            else
              echo "review_ok=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "approved=false" >> "$GITHUB_OUTPUT"
            echo "review_ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Post maintainer review on PR
        if: steps.pr.outputs.number != ''
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          REVIEW_OK: ${{ steps.outcome.outputs.review_ok }}
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('/tmp/maintainer-review.md', 'utf8');
            const pr = Number(process.env.PR_NUMBER);
            const event = process.env.REVIEW_OK === 'true' ? 'APPROVE' : 'REQUEST_CHANGES';

            // Sticky comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr,
            });
            const marker = '<!-- maintainer-bot-review -->';
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr,
                body,
              });
            }

            // Formal review (approve / request changes)
            try {
              await github.rest.pulls.createReview({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr,
                event,
                body: event === 'APPROVE'
                  ? 'Senior maintainer bot: static review clean. Merging if CI gate is green.'
                  : 'Senior maintainer bot: please address blockers before merge.',
              });
            } catch (e) {
              // Cannot re-approve identical or review own PR in some cases — comment already posted
              core.warning(`createReview: ${e.message}`);
            }

      - name: Skip draft PRs
        id: draft
        if: steps.pr.outputs.number != ''
        run: |
          if [ "${{ steps.pr.outputs.draft }}" = "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Draft PR — will not merge."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify required CI check is green
        id: ci
        if: steps.pr.outputs.number != '' && steps.draft.outputs.skip != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const pr = Number('${{ steps.pr.outputs.number }}');
            const { data: pull } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr,
            });
            const ref = pull.head.sha;
            const { data: checks } = await github.rest.checks.listForRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref,
            });
            const required = 'All checks passed';
            const hit = (checks.check_runs || []).filter(c => c.name === required);
            const green = hit.some(c => c.conclusion === 'success');
            // Also accept workflow_run success that triggered us
            const ok = green || context.eventName === 'workflow_run' &&
              context.payload.workflow_run?.conclusion === 'success';
            core.setOutput('green', String(!!ok || green));
            if (!green && context.eventName === 'workflow_run') {
              // Trust successful CI workflow_run for this head
              const run = context.payload.workflow_run;
              if (run.conclusion === 'success' && run.head_sha === ref) {
                core.setOutput('green', 'true');
                core.info('CI workflow_run success matches PR head — treating as green.');
                return;
              }
            }
            core.info(`Required check "${required}" green=${green}`);

      - name: Merge PR
        id: merge
        if: >
          steps.pr.outputs.number != '' &&
          steps.draft.outputs.skip != 'true' &&
          steps.outcome.outputs.review_ok == 'true' &&
          steps.ci.outputs.green == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          PR="${{ steps.pr.outputs.number }}"
          echo "Merging PR #$PR as senior maintainer..."
          # Prefer squash for linear history (branch protection)
          if gh pr merge "$PR" --repo "${{ github.repository }}" --squash --delete-branch; then
            echo "merged=true" >> "$GITHUB_OUTPUT"
            echo "✓ Merged PR #$PR"
          else
            echo "Merge via squash failed; trying merge commit..."
            if gh pr merge "$PR" --repo "${{ github.repository }}" --merge --delete-branch; then
              echo "merged=true" >> "$GITHUB_OUTPUT"
            else
              echo "merged=false" >> "$GITHUB_OUTPUT"
              echo "::warning::Could not merge (branch protection or conflicts). Human follow-up may be needed."
              exit 0
            fi
          fi

      - name: Comment merge result
        if: steps.merge.outputs.merged == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number('${{ steps.pr.outputs.number }}'),
              body: [
                '## ✅ Merged by senior maintainer bot',
                '',
                'CI was green and automated review found **no blockers**.',
                'Squash-merged into `main` and deleted the head branch.',
                '',
                '_Thank you for the contribution._',
              ].join('\n'),
            });

      - name: Comment blocked merge
        if: >
          steps.pr.outputs.number != '' &&
          steps.draft.outputs.skip != 'true' &&
          (steps.outcome.outputs.review_ok != 'true' || steps.ci.outputs.green != 'true')
        uses: actions/github-script@v7
        with:
          script: |
            const reviewOk = '${{ steps.outcome.outputs.review_ok }}' === 'true';
            const ciOk = '${{ steps.ci.outputs.green }}' === 'true';
            const reasons = [];
            if (!reviewOk) reasons.push('maintainer static review found **blockers**');
            if (!ciOk) reasons.push('required CI check is not green');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number('${{ steps.pr.outputs.number }}'),
              body: [
                '## ⏸️ Maintainer bot did not merge',
                '',
                reasons.map(r => `- ${r}`).join('\n'),
                '',
                'Fix the issues, push to the PR branch, and CI + maintainer will re-run automatically.',
              ].join('\n'),
            });
