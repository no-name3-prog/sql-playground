name: CI

# Auto-run on every PR (open / update / reopen) and on main pushes
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # One run per PR (or branch); cancel outdated pushes while iterating
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  # ─── Backend: typecheck + tests + build (always on PR) ───────────────────
  backend:
    name: Backend (typecheck · test · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install system deps (native modules)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3 make g++

      - name: Install dependencies
        run: npm ci

      - name: Seed sample databases
        run: npm run sample

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        id: test
        run: |
          set -o pipefail
          npm test 2>&1 | tee /tmp/backend-test.log
          # Extract node:test summary if present
          if grep -q '# tests ' /tmp/backend-test.log; then
            SUMMARY=$(grep -E '^# (tests|pass|fail|skipped) ' /tmp/backend-test.log | tr '\n' ' ')
            echo "summary=${SUMMARY}" >> "$GITHUB_OUTPUT"
          else
            echo "summary=tests completed" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        run: npm run build

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-log
          path: /tmp/backend-test.log
          if-no-files-found: ignore
          retention-days: 7

  # ─── Frontend: typecheck + production build ─────────────────────────────
  frontend:
    name: Frontend (typecheck · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  # ─── Dependency audit (informational) ───────────────────────────────────
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Audit backend
        working-directory: backend
        run: npm audit --audit-level=high || true

      - name: Audit frontend
        working-directory: frontend
        run: npm audit --audit-level=high || true

  # ─── Docker image build ─────────────────────────────────────────────────
  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: sql-playground:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── Required gate for branch protection ────────────────────────────────
  ci-success:
    name: All checks passed
    runs-on: ubuntu-latest
    needs: [backend, frontend, docker]
    if: always()
    steps:
      - name: Verify required jobs succeeded
        run: |
          echo "backend=${{ needs.backend.result }}"
          echo "frontend=${{ needs.frontend.result }}"
          echo "docker=${{ needs.docker.result }}"
          if [ "${{ needs.backend.result }}" != "success" ] \
            || [ "${{ needs.frontend.result }}" != "success" ] \
            || [ "${{ needs.docker.result }}" != "success" ]; then
            echo "::error::One or more required CI jobs failed — PR cannot be merged"
            exit 1
          fi
          echo "All required checks passed."

  # ─── PR comment: auto test report (only on pull_request) ────────────────
  pr-test-report:
    name: PR test report
    runs-on: ubuntu-latest
    needs: [backend, frontend, docker, ci-success]
    if: github.event_name == 'pull_request' && always()
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Post or update PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const emoji = '${{ needs.ci-success.result }}' === 'success' ? '✅' : '❌';
            const B = '${{ needs.backend.result }}';
            const F = '${{ needs.frontend.result }}';
            const D = '${{ needs.docker.result }}';
            const G = '${{ needs.ci-success.result }}';
            const headline = G === 'success'
              ? 'All automated tests and checks passed'
              : 'Automated checks failed — fix before merge';
            const body = [
              `## ${emoji} CI auto-run (PR #${{ github.event.pull_request.number }})`,
              '',
              `**${headline}**`,
              '',
              'Tests run **automatically** whenever this PR is opened or updated.',
              '',
              '| Check | Result |',
              '|-------|--------|',
              `| Backend typecheck · **test** · build | \`${B}\` |`,
              `| Frontend typecheck · build | \`${F}\` |`,
              `| Docker build | \`${D}\` |`,
              `| **All checks passed** (merge gate) | \`${G}\` |`,
              '',
              `Commit: \`${{ github.event.pull_request.head.sha }}\``,
              '',
              `[View full run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})`,
              '',
              '<!-- sql-playground-ci-report -->',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c =>
              c.user?.type === 'Bot' && c.body?.includes('<!-- sql-playground-ci-report -->')
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
